server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PDF de 5 Mo au plus (MAX_PDF_SIZE_BYTES) + offre + enveloppe multipart.
    client_max_body_size 6m;

    # API : /api/analyze -> http://backend:8000/analyze (même origine, pas de CORS).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Flux SSE : chaque événement part tout de suite, et une analyse peut durer plusieurs
        # minutes (le backend envoie un ping toutes les 15 s, ANALYSIS_TIMEOUT_S = 600 s).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        # Client parti : Nginx ferme la connexion amont, le backend annule l'analyse.
        proxy_ignore_client_abort off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
