[pytest]
pythonpath = .
testpaths = tests
# Tests d'intégration (vrai LLM, réseau) : désactivés par défaut, lancer pytest -m integration.
addopts = -m "not integration"
markers =
    integration: appelle les vrais fournisseurs (réseau, clé API requise)
filterwarnings =
    # Bruit connu des bindings SWIG de PyMuPDF, sans impact.
    ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning
    # FAISS n'existe que dans langchain-community, en fin de vie (voir Structure.md).
    ignore:`langchain-community` is being sunset:DeprecationWarning
