# Configuration des outils de qualité (le projet n'est pas un paquet installable).

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplifications.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "tests"]

[tool.ruff.lint.per-file-ignores]
# Contenu HTML des CV fictifs : une ligne par paragraphe, plus lisible ainsi.
"eval/cvs/make_*_cv.py" = ["E501"]
