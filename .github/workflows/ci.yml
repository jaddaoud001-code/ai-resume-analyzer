# Tests hors ligne et qualité, à chaque push et pull request. Aucun secret : les tests
# n'appellent ni le LLM ni un fournisseur d'embeddings (réseau bloqué par une fixture), et
# ne chargent jamais le vrai modèle d'embeddings local (garde-fou dans tests/conftest.py).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Dépendances
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      # Cache des modèles d'embeddings vide et explicite : les tests ne doivent dépendre
      # d'aucun modèle présent sur la machine (aucun n'est chargé ni téléchargé).
      - name: Tests (sans réseau, cache des modèles vide ; contrat des événements compris)
        env:
          EMBEDDINGS_CACHE_DIR: ${{ runner.temp }}/empty-embeddings-cache
        run: |
          mkdir -p "$EMBEDDINGS_CACHE_DIR"
          pytest
          test -z "$(ls -A "$EMBEDDINGS_CACHE_DIR")" || { echo "Un modèle a été écrit dans le cache pendant les tests"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tests (Vitest, fetch simulé)
        run: npm test
      - name: Build (TypeScript strict)
        run: npm run build
