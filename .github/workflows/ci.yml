# Tests hors ligne et qualité, à chaque push et pull request. Aucun secret : les tests
# n'appellent ni le LLM ni un fournisseur d'embeddings (réseau bloqué par une fixture).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Dépendances
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Tests (sans réseau ; contrat des événements avec le frontend compris)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tests (Vitest, fetch simulé)
        run: npm test
      - name: Build (TypeScript strict)
        run: npm run build
